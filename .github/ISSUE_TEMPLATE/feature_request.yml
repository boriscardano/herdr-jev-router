name: Feature request
description: Propose a focused change within project scope
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-visible problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: State measurable acceptance criteria without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives
      description: Explain why existing behavior cannot solve the problem.
    validations:
      required: true
